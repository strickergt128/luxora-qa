# Análisis estático con SonarCloud (E12)
sonar.projectKey=strickergt128_luxora-qa
sonar.organization=strickergt128
sonar.projectName=Luxora QA
sonar.sourceEncoding=UTF-8

# Código de la aplicación y pruebas
sonar.sources=backend/src,backend/server.js,frontend/src
sonar.tests=backend/tests,frontend/tests
sonar.exclusions=**/node_modules/**,**/coverage/**,**/reports/**

